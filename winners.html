<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOGO | Winners</title>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080420;--bg2:#0C0930;--panel:#110D32;--panel2:#160F38;--panel3:#1C1540;
  --border:rgba(213,235,213,0.08);--border-hi:rgba(213,235,213,0.18);
  --fire:#FF3D00;--ember:#FF6B00;--orange:#FF8C00;
  --lime:#C3FBA5;--lime-dim:rgba(195,251,165,0.12);--lime-glow:rgba(195,251,165,0.22);
  --text:#D5EBD5;--sub:rgba(213,235,213,0.65);--dim:rgba(213,235,213,0.40);
  --dimmer:rgba(213,235,213,0.22);--red:#FF4D4D;--green:#4ADE80;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);min-height:100vh;
  font-family:'Inter',sans-serif;color:var(--text);
  overflow-x:hidden;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle,rgba(213,235,213,0.04) 1px,transparent 1px);
  background-size:28px 28px;pointer-events:none;z-index:0;
}

/* ── NAV ── */
.nav{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:56px;
  background:rgba(8,4,32,0.92);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}
.nav-left{display:flex;align-items:center;gap:16px;}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-brand-wordmark{font-family:'Clash Display',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.04em;color:var(--text);}
.nav-brand-sub{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--dim);letter-spacing:0.14em;text-transform:uppercase;}
.nav-back{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--dim);text-decoration:none;
  padding:5px 10px;border:1px solid var(--border);border-radius:5px;
  transition:color .15s,border-color .15s;
}
.nav-back:hover{color:var(--text);border-color:var(--border-hi);}
.nav-right{display:flex;align-items:center;gap:8px;}
.lang-btn{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--dim);text-decoration:none;
  padding:4px 9px;border:1px solid transparent;border-radius:4px;
  transition:color .15s,border-color .15s,background .15s;
}
.lang-btn.active{color:var(--lime);border-color:rgba(195,251,165,0.25);background:var(--lime-dim);}
.lang-btn:hover:not(.active){color:var(--sub);border-color:var(--border);}

/* ── PAGE WRAP ── */
.page{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:48px 24px 80px;}

/* ── EYEBROW / HEADLINE ── */
.eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--fire);margin-bottom:10px;
}
.headline{
  font-family:'Clash Display',sans-serif;font-size:38px;font-weight:700;
  color:var(--text);line-height:1.1;margin-bottom:32px;
}

/* ── LOADING / PENDING ── */
.state-box{
  display:none;padding:48px 24px;text-align:center;
  border:1px solid var(--border);border-radius:8px;
  background:rgba(255,255,255,0.02);
}
.state-box.visible{display:block;}
.state-box p{color:var(--sub);font-size:0.9rem;line-height:1.7;margin-bottom:6px;}
.spinner{
  width:28px;height:28px;border:2px solid var(--border);
  border-top-color:var(--fire);border-radius:50%;
  animation:spin 0.8s linear infinite;margin:0 auto 20px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── WINNERS SECTIONS ── */
.wp-section{margin-bottom:32px;}
.wp-section-eyebrow{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fire);margin-bottom:8px;}
.wp-section-title{font-family:'Clash Display',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:16px;}
.wp-scroll{max-height:400px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;}
.wp-table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:10px;}
.wp-table th{text-align:left;padding:7px 10px;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);}
.wp-table td{padding:9px 10px;color:var(--sub);border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle;}
.wp-table td.hi{color:var(--lime);}
.winner-rank{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:4px;font-size:10px;font-weight:700;background:rgba(255,255,255,0.04);color:var(--dim);}
.winner-rank.gold{background:rgba(255,215,0,0.14);color:#FFD700;}
.winner-rank.silver{background:rgba(192,192,192,0.14);color:#C0C0C0;}
.winner-rank.bronze{background:rgba(205,127,50,0.14);color:#CD7F32;}
.ugc-pill-link{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--lime);text-decoration:none;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid rgba(195,251,165,0.2);border-radius:4px;white-space:nowrap;}
.ugc-pill-link:hover{background:rgba(195,251,165,0.07);border-color:rgba(195,251,165,0.4);}

/* ── CHAIN NOTICE + TX STRIP ── */
.winners-chain-notice{background:rgba(255,107,0,0.07);border:1px solid rgba(255,107,0,0.22);border-radius:8px;padding:13px 18px;margin-bottom:28px;font-size:0.83rem;color:var(--sub);line-height:1.6;}
.winners-chain-notice strong{color:var(--fire);}
.winners-chain-notice a{color:var(--lime);text-decoration:none;}
.winners-chain-notice a:hover{text-decoration:underline;}
.winners-tx-proof{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:-16px 0 24px;padding:10px 14px;border:1px solid rgba(255,255,255,0.07);border-radius:8px;background:rgba(255,255,255,0.02);}
.winners-tx-proof-label{font-size:0.7rem;color:var(--sub);opacity:0.5;width:100%;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.07em;}
.winners-tx-chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:var(--sub);font-size:0.72rem;text-decoration:none;white-space:nowrap;transition:border-color .15s,color .15s,background .15s;font-family:monospace;}
.winners-tx-chip:hover{border-color:rgba(255,107,0,0.45);color:var(--fire);background:rgba(255,107,0,0.06);text-decoration:none;}
.winners-tx-chip .tx-n{color:rgba(255,255,255,0.7);font-weight:600;}

/* ── POWERED BY ── */
.powered{
  display:flex;align-items:center;gap:8px;
  position:fixed;bottom:20px;right:20px;z-index:50;
  text-decoration:none;
  background:rgba(8,4,32,0.85);border:1px solid var(--border);
  border-radius:30px;padding:6px 12px 6px 6px;
  backdrop-filter:blur(8px);transition:border-color .2s;
}
.powered:hover{border-color:var(--border-hi);}
.powered-logo{width:28px;height:28px;border-radius:50%;background:#EEF9F9;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.powered-logo img{width:22px;height:22px;object-fit:contain;}
.powered-text{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);line-height:1.4;}
.powered-name{font-family:'Clash Display',sans-serif;font-size:11px;font-weight:600;color:var(--sub);}
</style>
</head>

      </div>

    <a class="nav-back" href="/" id="nav-back-btn">← Back</a>
  </div>

    <a class="lang-btn" id="lang-ko" href="/winners?lang=ko">한국어</a>

</nav>

<main class="page">
  <div class="eyebrow" id="t-eyebrow">FOGO Community Activation</div>

  <!-- Loading -->
  <div class="state-box visible" id="state-loading">

  <div class="state-box" id="state-pending">

    <p id="t-pending-sub">Winners will be announced soon. Stay tuned!</p>
  </div>

  <!-- Winners content -->
  <div id="winners-content" style="display:none;"></div>
</main>

// ── Helpers ─────────────────────────────────────────────────────────
function shortW(w) {
  if (!w) return '—';
  if (w.length <= 12) return w;
  return w.slice(0,6) + '…' + w.slice(-4);
}
function rankBadge(i) {
  var cls = i===0?'gold':i===1?'silver':i===2?'bronze':'';
  var lbl = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  return '<span class="winner-rank '+cls+'">'+lbl+'</span>';
}
function fmtAmt(n) {
  return '<span style="color:var(--fire);font-weight:700;">'+Number(n).toLocaleString()+' FOGO</span>';
}
function catTable(items, cols) {
  var heads = cols.map(function(c){return '<th>'+c.label+'</th>';}).join('');
  var rows  = items.map(function(item,i){
    var cells = cols.map(function(c){return '<td class="'+(c.cls||'')+'">'+c.fn(item,i)+'</td>';}).join('');
    return '<tr>'+cells+'</tr>';
  }).join('');
  return '<div class="wp-scroll"><table class="wp-table"><thead><tr>'+heads+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function buildTxStrip() {

  var chips = TX_PROOFS.map(function(tx,i){
    return '<a class="winners-tx-chip" href="https://fogoscan.com/tx/'+tx.sig+'" target="_blank" rel="noopener"><span class="tx-n">Tx '+(i+1)+'</span></a>';

  return '<div class="winners-tx-proof"><div class="winners-tx-proof-label">'+label+'</div>'+chips+'</div>';
}

// ── Render ───────────────────────────────────────────────────────────
function renderWinners(w) {
  var t = {
    pool500: isKo ? '500K FOGO 상금 풀' : '500K FOGO Prize Pool',
    pool50:  isKo ? '50K FOGO 상금 풀'  : '50K FOGO Prize Pool',
    lb:      isKo ? '🏆 상위 15위 리더보드'       : '🏆 Top 15 Leaderboard',
    draw:    isKo ? '🎲 럭키 드로우 — 200명 당첨'  : '🎲 Lucky Draw — 200 Winners',
    ugc:     isKo ? '🎨 상위 UGC — 10명 당첨'     : '🎨 Top UGC — 10 Winners',
    tap:     isKo ? '👆 탭 게임 — 5명 당첨'        : '👆 Tap Game — 5 Winners',
    wallet:  isKo ? '지갑' : 'Wallet',
    prize:   isKo ? '상금' : 'Prize',
    content: isKo ? '콘텐츠' : 'Content',
  };

  var chainNotice = isKo
    ? '<div class="winners-chain-notice">🔗 상금은 <strong>FOGO 체인</strong>에 있습니다. FOGO 잔액을 확인하려면 <a href="https://portfolio.fogo.io/" target="_blank">portfolio.fogo.io</a>를 이용하시거나 <a href="https://www.nightly.app/" target="_blank">Nightly 지갑</a>을 설치하세요.</div>'
    : '<div class="winners-chain-notice">🔗 Prizes are on <strong>FOGO chain</strong>. To view your FOGO balance, visit <a href="https://portfolio.fogo.io/" target="_blank">portfolio.fogo.io</a> or install <a href="https://www.nightly.app/" target="_blank">Nightly wallet</a>.</div>';

  var html = chainNotice + buildTxStrip();

  // Leaderboard
  html += '<div class="wp-section"><div class="wp-section-eyebrow">'+t.pool500+'</div><div class="wp-section-title">'+t.lb+'</div>';
  html += catTable(w.leaderboard||[], [
    {label:'#',       fn:function(r,i){return rankBadge(i);}},
    {label:t.wallet,  fn:function(r){return '<span class="hi" title="'+r.wallet+'">'+shortW(r.wallet)+'</span>';}, cls:'hi'},
    {label:t.prize,   fn:function(r){return fmtAmt(r.prize);}},
  ]);
  html += '</div>';

  // Lucky Draw
  html += '<div class="wp-section"><div class="wp-section-eyebrow">'+t.pool500+'</div><div class="wp-section-title">'+t.draw+'</div>';
  html += catTable(w.lucky_draw||[], [
    {label:'#',       fn:function(r,i){return i+1;}},
    {label:t.wallet,  fn:function(r){return '<span class="hi" title="'+r.wallet+'">'+shortW(r.wallet)+'</span>';}, cls:'hi'},
    {label:t.prize,   fn:function(r){return fmtAmt(r.prize);}},
  ]);
  html += '</div>';

  // UGC
  html += '<div class="wp-section"><div class="wp-section-eyebrow">'+t.pool500+'</div><div class="wp-section-title">'+t.ugc+'</div>';
  html += catTable(w.ugc||[], [
    {label:'#',        fn:function(r,i){return rankBadge(i);}},
    {label:t.wallet,   fn:function(r){return '<span class="hi" title="'+r.wallet+'">'+shortW(r.wallet)+'</span>';}, cls:'hi'},
    {label:t.content,  fn:function(r){return r.link?'<a class="ugc-pill-link" href="'+r.link+'" target="_blank" rel="noopener">🔗 View Post ↗</a>':'—';}},
    {label:t.prize,    fn:function(r){return fmtAmt(r.prize);}},
  ]);
  html += '</div>';

  // Tap Game
  html += '<div class="wp-section"><div class="wp-section-eyebrow">'+t.pool50+'</div><div class="wp-section-title">'+t.tap+'</div>';
  html += catTable(w.tap_game||[], [
    {label:'#',       fn:function(r,i){return rankBadge(i);}},
    {label:t.wallet,  fn:function(r){return '<span class="hi" title="'+r.wallet+'">'+shortW(r.wallet)+'</span>';}, cls:'hi'},
    {label:t.prize,   fn:function(r){return fmtAmt(r.prize);}},
  ]);
  html += '</div>';

  document.getElementById('winners-content').innerHTML = html;
  document.getElementById('winners-content').style.display = 'block';
}

// ── Fetch ────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  fetch(SUPA_URL+'/rest/v1/campaign_winners?is_active=eq.true&select=winners_data', {
    headers:{'apikey':SUPA_ANON,'Authorization':'Bearer '+SUPA_ANON}
  })
  .then(function(r){return r.json();})
  .then(function(rows){
    document.getElementById('state-loading').classList.remove('visible');
    if (!rows || !rows.length) {
      document.getElementById('state-pending').classList.add('visible');
      return;
    }
    renderWinners(rows[0].winners_data);
  })
  .catch(function(){
    document.getElementById('state-loading').classList.remove('visible');
    document.getElementById('state-pending').classList.add('visible');
  });
});
